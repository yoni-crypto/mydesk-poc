<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MyDesk POC</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      margin: 0;
      width: 100%;
      box-sizing: border-box;
    }
    h2 { margin: 0 0 8px 0; }
    .section { 
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 16px;
      background: #f9f9f9;
    }
    .section h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button { 
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    button:hover {
      background: #0056b3;
    }
    button:active {
      transform: scale(0.98);
    }
    #log { 
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      min-height: 100px;
      max-height: 300px;
      overflow-y: auto;
      background: white;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .success { color: #28a745; }
    .error { color: #dc3545; }
    .info { color: #17a2b8; }
  </style>
</head>
<body>
  <h2>🚀 MyDesk POC</h2>
  <p>Testing async commands with proper error handling</p>

  <div class="section">
    <h3>System Info</h3>
    <div class="buttons">
      <button onclick="getVersion()">Get Version</button>
      <button onclick="getSystemInfo()">Get System Info</button>
      <button onclick="getTime()">Get Time</button>
    </div>
  </div>

  <div class="section">
    <h3>File System</h3>
    <div class="buttons">
      <button onclick="readFile()">Read test.txt</button>
      <button onclick="writeFile()">Write test.txt</button>
      <button onclick="checkExists()">Check Exists</button>
      <button onclick="deleteFile()">Delete temp.txt</button>
    </div>
  </div>

  <div class="section">
    <h3>Response Log</h3>
    <div id="log">Waiting for commands...</div>
  </div>

  <script>
    let requestId = 1;

    function log(message, type = 'info') {
      const logEl = document.getElementById('log');
      const timestamp = new Date().toLocaleTimeString();
      const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
      logEl.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Handle responses from native
    window.fromNative = (response) => {
      console.log('Response:', response);
      
      if (response.success) {
        log(`✓ Success (id: ${response.id}): ${JSON.stringify(response.data)}`, 'success');
      } else {
        log(`✗ Error (id: ${response.id}): ${response.error.code} - ${response.error.message}`, 'error');
      }
    };

    function sendCommand(method, params = {}) {
      const id = `req_${requestId++}`;
      const request = {
        id,
        method,
        params
      };
      
      log(`→ Sending: ${method} (id: ${id})`, 'info');
      window.ipc.postMessage(JSON.stringify(request));
    }

    // System commands
    function getVersion() {
      sendCommand('app.version');
    }

    function getSystemInfo() {
      sendCommand('system.info');
    }

    function getTime() {
      sendCommand('system.time');
    }

    // File system commands
    function readFile() {
      sendCommand('fs.read', { path: 'test.txt' });
    }

    function writeFile() {
      const content = `Hello from MyDesk! Written at ${new Date().toISOString()}`;
      sendCommand('fs.write', { path: 'test.txt', content });
    }

    function checkExists() {
      sendCommand('fs.exists', { path: 'test.txt' });
    }

    function deleteFile() {
      sendCommand('fs.delete', { path: 'temp.txt' });
    }

    // Test error handling
    function testError() {
      sendCommand('fs.read', { path: '../etc/passwd' }); // Should fail with path traversal error
    }

    log('MyDesk POC initialized. Click buttons to test commands.', 'success');
  </script>
</body>
</html>
