[package]
name = "mydesk-poc"
version = "0.1.0"
edition = "2021"

[dependencies]
tao = "0.34"
wry = { version = "0.53.5", default-features = false, features = ["os-webview", "protocol", "drag-drop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
dirs = "5.0"
